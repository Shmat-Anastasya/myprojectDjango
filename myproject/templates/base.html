<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Магазин{% endblock %}</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        body { background: #f8f9fa; }
        header { background: #343a40; padding: 15px; }
        header a { color: white; margin-right: 15px; text-decoration: none; }
        header a:hover {
    text-decoration: underline;
}
nav a { margin-left: 20px; }

    </style>
</head>

<body>

<header class="d-flex justify-content-between align-items-center">
    <!-- ЛОГОТИП -->
    <a href="/" class="logo" style="font-family: 'Coolvetica', sans-serif; font-size: 26px; color: white; text-decoration:none;">
    REVIVAL
</a>


    <!-- МЕНЮ -->
    <nav>
        <a href="/">Главная</a>
        <a href="/catalog/">Каталог</a>
        <a href="/cart/">Корзина</a>

        {% if user.is_authenticated %}
            <a href="/profile/">Личный кабинет</a>
            <!-- <a href="/logout/">Выйти</a> -->
             <form action="/logout/" method="post" style="display:inline;">
    {% csrf_token %}
    <button type="submit" style="background:none;border:none;color:white;cursor:pointer;">
        Выйти
    </button>
</form>

        {% else %}
            <a href="/login/">Вход</a>
            <a href="/register/">Регистрация</a>
        {% endif %}
    </nav>
</header>



<div class="container mt-4">
    {% block content %}{% endblock %}
</div>

</body>
</html>
